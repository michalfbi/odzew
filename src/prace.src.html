<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odzew – trwają prace nad stroną</title>
<meta name="description" content="Odzew z Kielc. Trwają prace nad stroną, wracamy wkrótce.">
<meta property="og:title" content="Odzew – żadne zapytanie nie przepada">
<meta property="og:description" content="Trwają prace nad stroną. Wracamy wkrótce.">
<meta property="og:image" content="https://odzew.tech/odzew-podglad-linku-1200x630.png">
<meta property="og:url" content="https://odzew.tech/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://odzew.tech/">
<link rel="icon" href="data:image/svg+xml;base64,%%FAVICON%%">
<style>
%%FONTS%%
:root { --sygnal: #FFC21A; --grafit: #16181B; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sygnal); color: var(--grafit); font: 500 18px/1.55 'Inter', Arial, Helvetica, sans-serif; display: flex; flex-direction: column; }
.kol { width: min(1120px, 100% - 40px); margin-inline: auto; }
header { border-bottom: 2px solid var(--grafit); padding: 12px 0; }
header svg { height: 40px; width: auto; display: block; }
main { flex: 1; display: flex; align-items: center; padding: clamp(40px, 8vw, 96px) 0; }
.tresc { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
.etykieta { display: inline-flex; align-items: center; gap: 10px; font: 700 14px/1 'Barlow', 'Arial Narrow', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; background: var(--grafit); color: var(--sygnal); padding: 8px 12px; border-radius: 6px; }
.etykieta i { width: 8px; height: 8px; border-radius: 50%; background: var(--sygnal); animation: puls 1.6s ease-in-out infinite; }
@keyframes puls { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .etykieta i { animation: none; } }
h1 { margin: 0; font: 800 clamp(44px, 8vw, 96px)/0.98 'Barlow', 'Arial Narrow', Arial, sans-serif; letter-spacing: -0.025em; text-wrap: balance; }
p { margin: 0; max-width: 46ch; font-size: clamp(18px, 2vw, 21px); }
.telefon { display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--grafit); padding: 4px 0 4px 18px; }
.telefon span { font-size: 15px; font-weight: 600; }
.telefon a { font: 800 clamp(34px, 5vw, 52px)/1 'Barlow', 'Arial Narrow', Arial, sans-serif; color: inherit; text-decoration: none; font-variant-numeric: tabular-nums; }
.telefon a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--grafit); outline-offset: 4px; border-radius: 4px; }
</style>
</head>
<body>
<header><div class="kol">%%LOGO_ZOLTE%%</div></header>
<main>
  <div class="kol tresc">
    <span class="etykieta"><i></i>Strona w przebudowie</span>
    <h1>Trwają prace nad stroną.</h1>
    <p>Wracamy wkrótce. Telefon działa bez przerwy, także w weekend.</p>
    <div class="telefon">
      <span>Zadzwoń</span>
      <a href="tel:+48412306785">41 230 67 85</a>
    </div>
  </div>
</main>
</body>
</html>
