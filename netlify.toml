# Netlify publikuje gotowe pliki z folderu public. Strony nie trzeba budować przy wdrożeniu.
[build]
  publish = "public"

# Małe funkcje serwerowe: powiadomienia o rozmowach asystenta na Telegram.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Podgląd całej strony na czas prac: nie dla wyszukiwarek.
[[headers]]
  for = "/podglad/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Czcionki strony leżą na naszym serwerze i się nie zmieniają: przeglądarka trzyma je rok.
[[headers]]
  for = "/czcionki/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
