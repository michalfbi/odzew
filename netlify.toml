# Netlify publikuje gotowe pliki z folderu public. Strony nie trzeba budować przy wdrożeniu.
[build]
  publish = "public"

# Małe funkcje serwerowe: powiadomienia o rozmowach Oli na Telegram.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
